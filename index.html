<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設計你的專屬麻辣燙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --ink:#2a2a18;
  --muted:#6b6648;
  --panel:#f4ecd8;
  --chip:rgba(74,90,44,.09);
  --line:rgba(42,42,24,.15);
  --olive:#4a5a2c;
  --olive-deep:#2f3a1a;
  --brick:#a8351f;
  --brick-deep:#6e1f10;
  --gold:#c9a24a;
  --scene:#232a19;
  --on-scene:#f7f0dc;
  --line-green:#06c755;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#f2ebd5;
    --muted:#c4bb98;
    --panel:#262c1b;
    --chip:rgba(242,235,213,.08);
    --line:rgba(242,235,213,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f2ebd5;
  --muted:#c4bb98;
  --panel:#262c1b;
  --chip:rgba(242,235,213,.08);
  --line:rgba(242,235,213,.16);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--scene);color:var(--ink);font-family:var(--sans);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,a{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{appearance:none;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:800;cursor:pointer;touch-action:manipulation;letter-spacing:.04em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brick);color:#fff7e8;box-shadow:0 5px 0 var(--brick-deep),0 10px 22px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brick-deep)}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:active{transform:scale(.97)}
.btn.big{font-size:20px;padding:16px 28px;width:min(300px,100%)}
.link{appearance:none;background:none;border:0;padding:10px 8px;font-size:14px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.screen>*{pointer-events:auto}
.sheet{width:100%;max-width:540px;margin:0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:0 -12px 40px rgba(0,0,0,.4);animation:rise .4s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:.04em}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--olive);color:#fff7e8;font-size:13px;font-weight:800;margin-right:8px;vertical-align:3px}

/* title */
#title{justify-content:space-between;align-items:center;text-align:center}
.brand{margin-top:18px}
.brand .diy{display:inline-block;font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:.3em;color:var(--gold);border:1.5px solid var(--gold);padding:3px 4px 3px 10px;border-radius:4px}
.brand h1{margin:10px 0 0;font-family:var(--serif);font-weight:900;color:var(--on-scene);line-height:1.15;text-shadow:0 3px 18px rgba(0,0,0,.6)}
.brand h1 small{display:block;font-size:clamp(20px,6vw,28px);letter-spacing:.2em;opacity:.9}
.brand h1 span{display:block;font-size:clamp(40px,12.5vw,62px);letter-spacing:.08em}
.brand p{margin:12px 0 0;color:var(--on-scene);opacity:.85;font-size:14px;letter-spacing:.06em}
.title-actions{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
#bestLine{margin:0;color:var(--on-scene);opacity:.85;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* soup */
#soupScr{justify-content:flex-end}
#soupScr .sheet{padding:16px 14px 12px}
.soups{display:flex;flex-direction:column;gap:7px;margin:12px 0}
.soupBtn{appearance:none;border:0;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#fff7e8;cursor:pointer;text-align:left;touch-action:manipulation;box-shadow:inset 0 0 0 0 transparent;transition:transform .1s}
.soupBtn:active{transform:scale(.98)}
.soupBtn .num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#fff7e8;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.soupBtn b{font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.06em}
.soupBtn small{display:block;font-size:12px;opacity:.85;margin-top:1px}
.soupBtn.on{box-shadow:inset 0 0 0 3px #fff7e8,0 0 0 2px var(--gold)}
.soupBtn.on::after{content:"✓";margin-left:auto;font-weight:900;font-size:18px}

/* pick */
#pickScr{justify-content:flex-end}
#pickScr .sheet{padding:12px 10px 10px}
.pick-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
#pickCount{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:none;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:800;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer;touch-action:manipulation;position:relative}
.tab.on{background:var(--olive);color:#fff7e8;border-color:var(--olive)}
.tab i{font-style:normal;font-size:11px;margin-left:4px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;min-height:148px;align-content:start}
.item{appearance:none;border:0;background:var(--chip);border-radius:12px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;touch-action:manipulation}
.item:active{transform:scale(.94)}
.item svg{width:38px;height:38px;display:block}
.item span{font-size:12px;font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.item em{position:absolute;top:2px;right:3px;min-width:18px;line-height:18px;border-radius:9px;background:var(--brick);color:#fff7e8;font-size:11px;font-weight:800;font-style:normal;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.row .btn.ghost{flex:0 0 auto;min-width:72px}

/* result */
#result{justify-content:flex-end}
#result .sheet{padding:16px 16px 8px}
#result{display:block;overflow-y:auto;touch-action:pan-y;padding-top:36vh;pointer-events:auto}
.r-kicker{margin:0;font-size:13px;color:var(--muted);font-weight:700}
.r-title{margin:2px 0 4px;font-family:var(--serif);font-weight:900;font-size:clamp(28px,8.4vw,38px);line-height:1.2;color:var(--brick)}
.r-desc{margin:0;font-size:15px;line-height:1.6}
.r-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.r-sec h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.soupTag{display:inline-block;padding:4px 12px;border-radius:6px;color:#fff7e8;font-weight:800;font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.compbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--chip)}
.compbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#rNew{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#rNew span{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(201,162,74,.28)}
.coupon{width:100%;margin-top:14px;background:var(--line-green);color:#fff;box-shadow:0 5px 0 #048a3b,0 10px 20px rgba(0,0,0,.2);font-size:17px}
.coupon:active{transform:translateY(4px);box-shadow:0 1px 0 #048a3b}
.share{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.sh{appearance:none;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink);text-decoration:none;cursor:pointer;touch-action:manipulation}
.sh:active{transform:scale(.95)}
.sh svg{width:26px;height:26px}
.links{display:flex;justify-content:center;gap:10px;margin-top:6px}
.row.two .btn{flex:1}
.share-h{margin:14px 0 0;font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.promo{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:rgba(201,162,74,.2);border:1.5px dashed var(--gold);font-size:14px;font-weight:800;line-height:1.5;text-align:center;color:var(--ink)}
.coll-promo{max-width:560px;margin:0 auto 14px}
.fold{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.fold summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;color:var(--ink);padding:10px 2px;touch-action:manipulation}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"展開 ▾";font-size:13px;color:var(--muted)}
.fold[open] summary::after{content:"收合 ▴"}
.fold-body{padding:2px 0 8px}

#coll{background:var(--panel);color:var(--ink);overflow-y:auto;touch-action:pan-y;display:block;pointer-events:auto}
.coll-head{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto 12px}
.coll-head h2{margin:0;font-family:var(--serif);font-weight:900;font-size:26px}
#collProg{max-width:560px;margin:0 auto 12px;color:var(--muted);font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:560px;margin:0 auto 24px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--chip)}
.card h3{margin:0 0 4px;font-family:var(--serif);font-weight:900;font-size:17px;line-height:1.3}
.card p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.card.got{background:rgba(201,162,74,.2)}
.card.lock h3{color:var(--muted)}

#shareScr{background:rgba(14,16,9,.93);align-items:center;justify-content:center;gap:14px;pointer-events:auto}
#shareImg{max-width:min(400px,100%);max-height:70vh;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:auto}
#shareScr p{margin:0;color:var(--on-scene);font-size:15px;text-align:center;line-height:1.55}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);z-index:40;background:rgba(18,20,10,.85);color:var(--on-scene);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#pop{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;font-family:var(--serif);font-weight:900;font-size:40px;color:var(--on-scene);text-shadow:0 3px 0 var(--brick-deep),0 6px 22px rgba(0,0,0,.55);opacity:0}
#pop.show{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-20px)}}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--on-scene);font-size:16px;line-height:1.6;z-index:60}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast"></div>
<div id="pop"></div>

<section id="title" class="screen">
  <div class="brand">
    <span class="diy">DIY</span>
    <h1><small>設計你的</small><span>專屬麻辣燙</span></h1>
    <p>選湯底、挑配料，看看你是哪種麻辣燙人</p>
  </div>
  <div class="title-actions">
    <p id="bestLine"></p>
    <button class="btn primary big" id="startBtn">開始設計</button>
    <button class="btn ghost" id="collBtn" style="background:rgba(244,236,216,.92);color:#2a2a18">稱號收集冊</button>
  </div>
</section>

<section id="soupScr" class="screen" hidden>
  <div class="sheet">
    <h2><span class="stepno">1</span>選一個湯底</h2>
    <div class="soups" id="soups"></div>
    <div class="row" style="margin-top:4px">
      <button class="btn ghost" id="soupBack">返回</button>
      <button class="btn primary" id="soupNext" disabled>下一步：挑配料</button>
    </div>
  </div>
</section>

<section id="pickScr" class="screen" hidden>
  <div class="sheet">
    <div class="pick-head"><h2><span class="stepno">2</span>挑配料</h2><span id="pickCount">還沒放任何料</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div class="row">
      <button class="btn ghost" id="undoBtn">復原</button>
      <button class="btn ghost" id="clearBtn">清空</button>
      <button class="btn primary" id="cookBtn">下鍋煮！</button>
    </div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <div class="sheet">
    <p class="r-kicker">你的專屬麻辣燙是</p>
    <h2 class="r-title" id="rTitle"></h2>
    <p class="r-desc" id="rDesc"></p>
    <div id="rNew"></div>
    <div class="row two">
      <button class="btn primary" id="againBtn">再設計一碗</button>
      <button class="btn ghost" id="rColl">稱號收集冊</button>
    </div>
    <a class="btn coupon" id="couponBtn" href="#" target="_blank" rel="noopener" hidden>加入 LINE 會員，領取優惠券</a>
    <p class="promo">🎁 集滿所有稱號，或分享結果到社群，就能領取優惠券喔！</p>
    <div class="share">
      <button class="sh" id="shIG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>IG</button>
      <button class="sh" id="shLine"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="17" rx="7" fill="#06c755"/><text x="12" y="14.6" text-anchor="middle" font-size="6.6" font-weight="900" fill="#fff" font-family="sans-serif">LINE</text></svg>LINE</button>
      <button class="sh" id="shThreads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M16.5 11.2c-.3-2.6-2-3.9-4.3-3.9-2.6 0-4 1.6-4 1.6"/><path d="M8.6 14.2c0 1.6 1.4 2.6 3.1 2.5 2.3-.1 3.4-1.8 3.4-4.8 0-4-2.1-6.6-5.6-6.6C5.8 5.3 4 8.3 4 12c0 3.9 2 7 6.6 7 3.7 0 6.2-1.6 7.2-4.3"/><path d="M15.4 12.2c-1-.5-2.4-.7-3.6-.6-2 .1-3.2 1.1-3.2 2.6"/></svg>脆</button>
      <button class="sh" id="shImg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>存成圖片</button>
    </div>
    <details class="fold">
      <summary>你的麻辣燙食譜</summary>
      <div class="fold-body">
        <span class="soupTag" id="rSoup"></span>
        <div class="chips" id="rItems"></div>
      </div>
    </details>
    <details class="fold">
      <summary>成分分析</summary>
      <div class="fold-body">
        <div class="compbar" id="rBar"></div>
        <div class="legend" id="rLegend"></div>
      </div>
    </details>
    <div class="links">
      <button class="link" id="rHome">回首頁</button>
    </div>
  </div>
</section>

<section id="coll" class="screen" hidden>
  <div class="coll-head"><h2>稱號收集冊</h2><button class="btn ghost" id="collClose">關閉</button></div>
  <p id="collProg"></p>
  <p class="promo coll-promo">🎁 集滿所有稱號，或分享結果到社群，就能領取優惠券喔！</p>
  <div class="cgrid" id="cgrid"></div>
</section>

<section id="shareScr" class="screen" hidden>
  <img id="shareImg" alt="你的麻辣燙食譜卡">
  <p id="shareTip">長按圖片儲存，就能分享到 IG 限動、LINE 或脆</p>
  <div class="row" style="width:min(400px,100%);margin:0">
    <a class="btn ghost" id="dlBtn" download="my-mala.jpg" href="#" style="background:rgba(244,236,216,.92);color:#2a2a18;flex:1">下載圖片</a>
    <button class="btn ghost" id="shareClose" style="background:rgba(244,236,216,.92);color:#2a2a18;flex:1">關閉</button>
  </div>
</section>

<div id="nogl" hidden>這台裝置的瀏覽器無法顯示 3D 畫面。請改用最新版的 Safari 或 Chrome 開啟。</div>

<script defer src="/_vercel/insights/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ===== 之後要填的設定 ===== */
const CONFIG={
  gameUrl:'https://malatanggame.vercel.app',        // 遊戲正式網址，會附在分享文字裡
  lineCouponUrl:'',  // LINE 官方帳號加好友／領優惠券連結
  gaId:'G-S6SH7VD5TN', // Google Analytics 4 評估 ID（G- 開頭），填了才會開始記錄點擊數據
};

const $=s=>document.querySelector(s);
/* ---------- 數據追蹤（Google Analytics 4） ---------- */
if(CONFIG.gaId){
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){ window.dataLayer.push(arguments); };
  window.gtag('js',new Date()); window.gtag('config',CONFIG.gaId);
  const sc=document.createElement('script'); sc.async=true; sc.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(CONFIG.gaId); document.head.appendChild(sc);
}
function track(name,params){ try{ if(window.gtag) window.gtag('event',name,params||{}); }catch(e){} }
function linkFor(src){ return CONFIG.gameUrl?`${CONFIG.gameUrl}/?utm_source=${src}&utm_medium=share`:''; }
if(typeof THREE==='undefined'){ $('#nogl').hidden=false; $('#title').hidden=true; return; }
const TAU=Math.PI*2, V3=THREE.Vector3, V2=THREE.Vector2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
const C=h=>new THREE.Color(h).convertSRGBToLinear();

const canvas=$('#c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true}); }
catch(e){ $('#nogl').hidden=false; $('#title').hidden=true; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;

function ctex(w,h,draw,rep){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); }
  return t;
}

function wavy(w,h,amp,cup,freq){
  const g=new THREE.PlaneGeometry(w,h,12,8), p=g.attributes.position, ph=Math.random()*6;
  for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i); p.setZ(i,Math.sin(x/w*(freq||9)+ph)*amp+(x*x/(w*w)+y*y/(h*h))*cup); }
  g.computeVertexNormals(); g.rotateX(-Math.PI/2); return g;
}

function leaf(col,vein,s,key){ const m=mesh(wavy(.6*s,.48*s,.035,.14),TM(key,PAT.leaf(col,vein),{alphaTest:.5,side:THREE.DoubleSide,roughness:.5})); return grp(m); }
function cluster(n,make){ const g=new THREE.Group(); for(let i=0;i<n;i++){ const m=make(i); g.add(m); } return g; }

    const cap=mesh(new THREE.SphereGeometry(.065,12,8,0,TAU,0,Math.PI/2),TM(key,PAT.dots(capCol,'rgba(90,60,30,.35)',40,1.5,3.5))); cap.position.y=.17; cap.scale.y=.75; g.add(cap);
    g.rotation.set(Math.PI/2+rnd(-.3,.3),0,rnd(0,TAU)); g.position.set(gauss()*.08,.04,gauss()*.08); return g;
  });
}
function nestCurve(R,H){ const pts=[]; let a=Math.random()*TAU; const dir=Math.random()<.5?1:-1; let y=Math.random()*H; const r0=R*rnd(.3,.95);
  for(let i=0;i<16;i++){ a+=dir*rnd(.35,.6); y=clamp(y+(Math.random()-.5)*H*.3,.01,H); const r=r0*rnd(.86,1.1)+(i%2?1:-1)*.012; pts.push(new V3(Math.cos(a)*r,y,Math.sin(a)*r)); }
  return new THREE.CatmullRomCurve3(pts); }
function mergeGeos(geos){
  let nv=0,ni=0; geos.forEach(g=>{ nv+=g.attributes.position.count; ni+=g.index.count; });
  const pos=new Float32Array(nv*3), nor=new Float32Array(nv*3), idx=nv<65535?new Uint16Array(ni):new Uint32Array(ni); let vo=0,io=0;
  geos.forEach(g=>{ pos.set(g.attributes.position.array,vo*3); nor.set(g.attributes.normal.array,vo*3); const a=g.index.array; for(let k=0;k<a.length;k++) idx[io+k]=a[k]+vo; vo+=g.attributes.position.count; io+=a.length; });
  const m=new THREE.BufferGeometry(); m.setAttribute('position',new THREE.BufferAttribute(pos,3)); m.setAttribute('normal',new THREE.BufferAttribute(nor,3)); m.setIndex(new THREE.BufferAttribute(idx,1)); m.computeBoundingSphere(); return m;
}
function nest(col,th,n,R,H,o){ const gs=[]; for(let i=0;i<n;i++) gs.push(new THREE.TubeGeometry(nestCurve(R,H),40,th,4,false)); const m=mesh(mergeGeos(gs),M(col,Object.assign({roughness:.4},o||{}))); gs.forEach(g=>g.dispose()); return grp(m); }

/* noodle builders */
function waveCurve(len,z0,y0,amp,freq){ const pts=[], ph=Math.random()*6, n=70; for(let i=0;i<=n;i++){ const t=i/n; pts.push(new V3((t-.5)*len, y0+Math.sin(t*Math.PI)*.012+rnd(-.003,.003), z0+Math.sin(t*freq+ph)*amp)); } return new THREE.CatmullRomCurve3(pts); }
function instantNoodle(col,th,rows,len,wid,layers,amp){
  const gs=[];
  for(let l=0;l<layers;l++) for(let r=0;r<rows;r++){ const z0=(r/(rows-1)-.5)*wid+rnd(-.008,.008); gs.push(new THREE.TubeGeometry(waveCurve(len*rnd(.86,1.04),z0,l*th*2.1,amp,rnd(52,64)),140,th,5,false)); }
  const m=mesh(mergeGeos(gs),M(col,{roughness:.42})); gs.forEach(g=>g.dispose()); return grp(m);
}
function flowNoodle(col,th,n,len,o){
  const gs=[], base=Math.random()*TAU;
  for(let i=0;i<n;i++){ const a=base+rnd(-.35,.35), dx=Math.cos(a), dz=Math.sin(a), ph=rnd(0,6), bend=rnd(1.4,2.6), off=rnd(-.07,.07), pts=[];
    for(let k=0;k<=26;k++){ const t=k/26, s=(t-.5)*len*rnd(.97,1.03), w=Math.sin(t*bend*Math.PI+ph)*.07+off; pts.push(new V3(dx*s-dz*w, .008+Math.random()*.03, dz*s+dx*w)); }
    gs.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,th,4,false)); }
  const m=mesh(mergeGeos(gs),M(col,Object.assign({roughness:.18},o||{}))); gs.forEach(g=>g.dispose()); return grp(m);
}
function stickBundle(col,th,n,len){
  const gs=[];
  for(let i=0;i<n;i++){ const g=new THREE.CylinderGeometry(th,th,len*rnd(.9,1.05),5); g.rotateZ(Math.PI/2+rnd(-.05,.05)); g.rotateY(rnd(-.06,.06)); g.translate(rnd(-.02,.02),(i%3)*th*2.1+.01,(Math.floor(i/3)/(n/3)-.5)*.16); gs.push(g); }
  const m=mesh(mergeGeos(gs),M(col,{roughness:.5})); gs.forEach(g=>g.dispose()); return grp(m);
}
function cookedNoodle(col,th,n,len,kink,o){
  const gs=[];
  for(let i=0;i<n;i++){
    const r0=Math.sqrt(Math.random())*.85, a0=Math.random()*TAU; let px=Math.cos(a0)*r0, pz=Math.sin(a0)*r0, hd=Math.random()*TAU;
    const steps=Math.round(len/.03), ph=Math.random()*6, pts=[];
    for(let k=0;k<=steps;k++){
      hd+=gauss()*.28; const d=Math.hypot(px,pz);
      if(d>.9){ const to=Math.atan2(-pz,-px); let df=to-hd; df=Math.atan2(Math.sin(df),Math.cos(df)); hd+=df*.35; }
      px+=Math.cos(hd)*.03; pz+=Math.sin(hd)*.03;
      const kx=kink?Math.sin(k*1.15+ph)*kink:0;
      pts.push(new V3(px-Math.sin(hd)*kx, .004+Math.sin(k*.35+ph)*.013+rnd(-.002,.002), pz+Math.cos(hd)*kx));
    }
    gs.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),steps*4,th,4,false));
  }
  const m=mesh(mergeGeos(gs),M(col,Object.assign({roughness:.35},o||{}))); gs.forEach(g=>g.dispose());
  const g=grp(m); g.userData.spread=true; return g;
}

function surf(){ return S.soup?S.soup.lv:.78; }

function setSoupLook(sp){
  soupMat.color.copy(C(sp.c)); streamMat.color.copy(soupMat.color); dropMat.color.copy(soupMat.color);
  soupMat.opacity=sp.dry?1:(sp.pat==='mala'||sp.pat==='tomato'?.86:.9);

function spot(){
  const R=POT_IN(surf())-.32;
  let best=null,bs=1e9;
  for(let k=0;k<12;k++){ const a=Math.random()*TAU, r=Math.sqrt(Math.random())*R, x=Math.cos(a)*r, z=Math.sin(a)*r; let s=0; placed.forEach(o=>{ if(o.userData.spread) return; const d=Math.hypot(o.position.x-x,o.position.z-z); if(d<.38) s+=.38-d; }); if(s<bs){ bs=s; best=[x,z]; } }
  return best;
}
function addItem(id,instant){
  const g=BUILD[id](); g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  if(g.userData.spread){
    g.rotation.set(0,Math.random()*TAU,0); g.position.set(0,0,0);
    const ty=surf()-.004; g.position.y=instant?ty:ty+.7;
    Object.assign(g.userData,{id,ty,vy:0,ph:Math.random()*TAU,landed:!!instant});
    itemsG.add(g); placed.push(g); return g;
  }
  const [x,z]=spot();
  const near=placed.filter(o=>!o.userData.spread&&Math.hypot(o.position.x-x,o.position.z-z)<.34).length;
  g.rotation.set(rnd(-.35,.35),rnd(0,TAU),rnd(-.35,.35));
  g.position.set(x,0,z); g.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(g), h=bb.max.y-bb.min.y;
  const ty=surf()-h*(S.soup&&S.soup.dry?.25:.42)-bb.min.y+Math.min(.18,near*.04);

  itemsG.add(g); placed.push(g);
  return g;
}

function computeGoal(){
  const s=SHOTS[shotName], vf=camera.fov*Math.PI/180, hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const dist=s.r/Math.sin(Math.min(vf,hf)/2), el=s.el*Math.PI/180, az=s.orbit?Math.sin(clock*.18)*.45:0;
  goal.tgt.set(s.t[0],s.t[1],s.t[2]);
  goal.pos.set(goal.tgt.x+dist*Math.cos(el)*Math.sin(az),goal.tgt.y+dist*Math.sin(el),goal.tgt.z+dist*Math.cos(el)*Math.cos(az));
}

function analyze(){
  const cnt={}, types={}; CATS.forEach(c=>{ cnt[c[0]]=0; types[c[0]]=0; });
  Object.keys(S.counts).forEach(id=>{ const c=BYID[id].cat; cnt[c]+=S.counts[id]; types[c]++; });
  const has=id=>!!S.counts[id], N=total(), D=Object.keys(S.counts).length, sp=SOUPS.indexOf(S.soup);
  return {cnt,types,has,N,D,sp};
}
function matchTitles(a){
  const {cnt,types,has,N,D,sp}=a;
  const GREEN=0,MALA=1,TOMATO=2,MUSH=3,DRY=4;
  const meatSea=cnt.meat+cnt.sea;
  const otherStaple=['prince','glass','ricecake','ramyeon','chickennoodle'].some(has);
  const cond={
    empty:N===0,
    mono:D===1,
    everything:D>=20,
    indecisive:CATS.every(c=>cnt[c[0]]>0),
    tomatoKing:sp===TOMATO&&has('chicken')&&has('fish')&&cnt.mush>0,
    forest:sp===MUSH&&types.mush>=4,
    maodu:sp===MALA&&has('maodu')&&has('tripe'),
    malaGourmet:sp===MALA&&has('duckblood')&&has('frozentofu'),
    greenPepper:sp===GREEN&&has('chicken')&&types.veg>=2,
    dryFan:sp===DRY&&types.staple>=2,
    italian:sp===TOMATO&&has('cheeseball'),
    warm:sp===TOMATO&&has('pumpkin')&&has('corn'),
    ranch:has('pork')&&has('beef')&&has('lamb')&&has('chicken'),
    diet:(has('chicken')||has('shrimp'))&&has('konjac')&&!otherStaple&&cnt.hot===0,
    kid:has('eggdumpling')&&has('cheeseball')&&has('corn')&&cnt.offal===0&&sp!==MALA,
    seafood:types.sea>=3&&cnt.meat===0,
    bloodTest:has('duckblood')&&has('pigblood'),
    offalBrave:has('tripe')&&has('maodu'),
    balls:has('gongwan')&&has('fishdumpling')&&has('yandumpling'),
    taiwan:has('prince')&&has('tempura'),
    kdrama:has('ricecake')&&(has('ramyeon')||has('cheeseball')),
    carb:types.staple>=3,
    hotpot:types.hot>=5,
    tofuFan:types.tofu>=4,
    herbivore:N>=3&&N===cnt.veg+cnt.mush,
    meatLover:N>=4&&meatSea/N>=.5,
    landSea:cnt.meat>0&&cnt.sea>0,
    minimal:D>=2&&D<=3,
    balanced:cnt.veg>0&&meatSea>0&&cnt.staple>0,
    casual:true,
  };
  return TITLES.filter(t=>cond[t.id]);
}

function wrap(g,text,x,y,maxW,lh,maxLines){
  let line='', lines=0;

}

  y+=18; g.fillStyle=S.soup.bg; const sw=g.measureText(S.soup.n).width; g.font=`800 32px ${SANS}`; const tw=g.measureText(S.soup.n).width+40; g.fillRect(60,y-36,tw,52); g.fillStyle='#fff7e8'; g.fillText(S.soup.n,80,y);
  y+=58; g.fillStyle='#2a2a18'; g.font=`700 30px ${SANS}`;
  const items=list.length?list.map(x=>x.n+(x.k>1?`×${x.k}`:'')).join('、'):'什麼都沒放';
  y=wrap(g,'配料：'+items,60,y,W-120,44,4);
  y+=10; const N=a.N||1; let bx2=60; const barW=W-120;
  CATS.forEach(cc=>{ const v=a.cnt[cc[0]]; if(!v) return; const w=barW*v/N; g.fillStyle=cc[2]; g.fillRect(bx2,y,w,22); bx2+=w; });
  y+=56; g.font=`700 26px ${SANS}`; let lx=60;
  CATS.forEach(cc=>{ const v=a.cnt[cc[0]]; if(!v) return; const t=`${cc[1]} ${Math.round(v/N*100)}%`; const tw2=g.measureText(t).width+44; if(lx+tw2>W-60){ lx=60; y+=40; } g.fillStyle=cc[2]; g.fillRect(lx,y-20,20,20); g.fillStyle='#2a2a18'; g.fillText(t,lx+28,y); lx+=tw2; });
  const FH=230; g.fillStyle='#4a5a2c'; g.fillRect(0,H-FH,W,FH);
  const hasQR=CONFIG.gameUrl&&drawQR(g,linkFor('qr'),W-60-170,H-FH+30,170);
  g.textAlign='left'; g.fillStyle='#f7f0dc'; g.font=`900 44px ${SERIF}`; g.fillText('你也來設計一碗！',60,H-FH+82);
  g.font=`700 28px ${SANS}`; g.fillStyle='rgba(247,240,220,.85)'; g.fillText(hasQR?'掃描 QR 碼，看看你是哪種麻辣燙人':'看看你是哪種麻辣燙人',60,H-FH+132);
  if(CONFIG.gameUrl){ g.fillStyle='#e8c76a'; g.font=`800 32px ${SANS}`; g.fillText(CONFIG.gameUrl.replace(/^https?:\/\//,''),60,H-FH+184); }
  try{ return c.toDataURL('image/jpeg',.9); }catch(e){ return null; }
}
function drawQR(g,text,x,y,size){
  if(typeof qrcode==='undefined') return false;
  try{ const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(), cell=size/(n+2);
    g.fillStyle='#ffffff'; g.fillRect(x,y,size,size); g.fillStyle='#1d2414';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) g.fillRect(x+(c+1)*cell,y+(r+1)*cell,Math.ceil(cell),Math.ceil(cell));
    return true; }catch(e){ return false; }
}
function toFile(dataUrl){ const b=atob(dataUrl.split(',')[1]), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return new File([u],'my-mala.jpg',{type:'image/jpeg'}); }
let prepP=null;
function prepShare(){ prepP=makeShare().then(url=>{ S.shareUrl=url; try{ S.shareFile=url?toFile(url):null; }catch(e){ S.shareFile=null; } }); return prepP; }
async function openShareImg(tip){
  if(!S.shareUrl) await (prepP||prepShare());
  const url=S.shareUrl; if(!url){ toast('這台裝置無法產生圖片'); return null; }
  $('#shareImg').src=url; $('#dlBtn').href=url; $('#shareTip').textContent=tip; $('#shareScr').hidden=false; return url;
}
$('#shImg').addEventListener('click',()=>{ track('share_click',{platform:'save_image'}); }); $('#shImg').addEventListener('click',()=>openShareImg('長按圖片就能儲存，分享到 IG、LINE 或脆'));
const APPN={ig:'Instagram',line:'LINE',threads:'Threads'};
async function shareTo(app){
  const text=shareText(app); track('share_click',{platform:app});
  try{ navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{}); }catch(e){}
  if(!S.shareFile) await (prepP||prepShare());
  const f=S.shareFile;
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    toast(`在分享選單裡選 ${APPN[app]}，連結也幫你複製好了`,3500);
    try{ await navigator.share({files:[f],text}); track('share_complete',{platform:app}); return; }catch(e){ if(e&&e.name==='AbortError'){ track('share_cancel',{platform:app}); return; } }
  }
  if(app==='line') window.open('https://line.me/R/share?text='+encodeURIComponent(text),'_blank');
  if(app==='threads') window.open('https://www.threads.net/intent/post?text='+encodeURIComponent(text),'_blank');
  openShareImg(app==='ig'?'長按圖片儲存，再到 IG 發限動或貼文。遊戲連結已複製，可以直接貼上':'長按或下載圖片，貼到貼文裡就能分享。遊戲連結已複製');
}
$('#shIG').addEventListener('click',()=>shareTo('ig'));
$('#shLine').addEventListener('click',()=>shareTo('line'));
$('#shThreads').addEventListener('click',()=>shareTo('threads'));
$('#shareClose').addEventListener('click',()=>{ $('#shareScr').hidden=true; });

/* collection */
let collBack='#title';
function refreshTitle(){
  const got=TITLES.filter(t=>save.unlocked[t.id]).length;
  $('#collBtn').textContent=`稱號收集冊（${got}／${TITLES.length}）`;
  $('#bestLine').textContent=save.bowls?`你已經設計了 ${save.bowls} 碗`:'';
}
function openColl(back,from){
  collBack=back; track('collection_open',{from:from});
  const got=TITLES.filter(t=>save.unlocked[t.id]).length;
  $('#collProg').textContent=`已收集 ${got}／${TITLES.length} 個稱號。沒解開的會顯示提示。`;
  $('#cgrid').innerHTML=TITLES.map(t=>save.unlocked[t.id]?`<div class="card got"><h3>${t.n}</h3><p>${t.d}</p></div>`:`<div class="card lock"><h3>？？？</h3><p>提示：${t.h}</p></div>`).join('');
  $('#coll').hidden=false; $('#coll').scrollTop=0;
}
$('#collBtn').addEventListener('click',()=>openColl('#title','title'));
$('#rColl').addEventListener('click',()=>openColl('#result','result'));
$('#collClose').addEventListener('click',()=>{ $('#coll').hidden=true; });

function showcase(){
  clearItems(); S.soup=SOUPS[2]; setSoupLook(S.soup); S.level=S.soup.lv;
  ['chicken','fish','shiitake','cabbage','corn','tomato','tofu','eggdumpling','enoki','shrimp','pumpkin'].forEach(id=>{ S.counts[id]=1; S.order.push(id); addItem(id,true); });
  S.counts={}; S.order=[];
}

/* ---------- loop ---------- */
let last=performance.now(), steamAcc=0, bubAcc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur); tw.fn(k); if(k>=1){ tweens.splice(i,1); tw.res(); } }
  const L=S.level;
  soupMesh.visible=overMesh.visible=L>.05;
  { const r=POT_IN(L)-.01; soupMesh.position.y=L; soupMesh.scale.set(r,r,1); overMesh.position.y=L+.003; overMesh.scale.set(r,r,1); }
  const boiling=S.step==='cook'||S.step==='result'||S.step==='title';
  placed.forEach(g=>{
    const u=g.userData;
    if(!u.landed){ u.vy-=16*dt; g.position.y+=u.vy*dt; if(g.position.y<=u.ty){ g.position.y=u.ty; if(u.vy<-3){ u.vy=-u.vy*.22; if(!S.soup||!S.soup.dry) splash(g.position.x,u.ty+.03,g.position.z,4); } else u.landed=true; } }
    else if(boiling&&!(S.soup&&S.soup.dry)) g.position.y=u.ty+Math.sin(clock*(S.step==='cook'?5:2)+u.ph)*(S.step==='cook'?.03:.012);
  });
  if(S.soup&&!S.soup.dry&&L>.3){
    bubAcc+=dt*(S.step==='cook'?3:1); while(bubAcc>.09){ bubAcc-=.09; const an=Math.random()*TAU, r=Math.sqrt(Math.random())*(POT_IN(L)-.1); const p=emit(bubbles,Math.cos(an)*r,L+.04,Math.sin(an)*r); if(p) p.max=rnd(.35,.6); }
  }
  steamAcc+=dt; while(steamAcc>.14){ steamAcc-=.14; if(S.soup&&L>.1&&Math.random()<(S.step==='cook'?1:.55)){ const p=emit(steam,gauss()*.7,L+.15,gauss()*.7); if(p){ p.max=rnd(1.8,3); p.v.set(gauss()*.06,rnd(.35,.6),gauss()*.06); } } }
  steam.forEach(p=>{ if(!p.s.visible) return; p.life+=dt; const k=p.life/p.max; if(k>=1){ p.s.visible=false; return; } p.s.position.addScaledVector(p.v,dt); const sc=lerp(.4,1.5,k); p.s.scale.set(sc,sc,1); const cd=p.s.position.distanceTo(camera.position); p.s.material.opacity=Math.sin(k*Math.PI)*.16*clamp((cd-1.5)/2,0,1); });
  bubbles.forEach(p=>{ if(!p.s.visible) return; p.life+=dt; const k=p.life/p.max; if(k>=1){ p.s.visible=false; return; } const sc=lerp(.03,.14,k); p.s.scale.set(sc,sc,1); p.s.material.opacity=(1-k)*.6; });
  drops.forEach(d=>{ if(!d.m.visible) return; d.v.y-=9.8*dt; d.m.position.addScaledVector(d.v,dt); if(d.m.position.y<S.level+.02) d.m.visible=false; });
  computeGoal();
  const kk=1-Math.exp(-dt*3.2); cam.pos.lerp(goal.pos,kk); cam.tgt.lerp(goal.tgt,kk);
  viewUp=lerp(viewUp,SHOTS[shotName].up||0,kk); camera.setViewOffset(window.innerWidth,window.innerHeight,0,viewUp*window.innerHeight,window.innerWidth,window.innerHeight);
  camera.position.copy(cam.pos); camera.lookAt(cam.tgt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
showcase(); refreshTitle();
computeGoal(); cam.pos.copy(goal.pos).add(new V3(0,1.5,2.5)); cam.tgt.copy(goal.tgt);
requestAnimationFrame(frame);
})();
</script>
